name: Refresh dependency checksums

# Run by hand (or by pushing the deps-refresh branch) after changing dependencies.
# Writes gradle/verification-metadata.xml to the deps-metadata branch for review;
# it is copied into main only after a person or the assistant has looked at it.
on:
  workflow_dispatch:
  push:
    branches: [deps-refresh]

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Set up Rust and Ninja
        run: |
          RUST="$(grep -E '^rustToolchain' gradle/tools.versions.toml | cut -d'"' -f2)"
          rustup toolchain install "$RUST" --profile minimal --target aarch64-linux-android
          rustup default "$RUST"
          sudo apt-get install -y -qq ninja-build
      - name: Write checksums
        shell: bash
        run: |
          # Keep the existing file: Gradle adds what is new, so entries a run does not happen to touch are not lost
          # Failing tests must not stop the checksums from being written; the log shows why
          ./gradlew --no-daemon --continue --write-verification-metadata sha256 :app:testDebugUnitTest --tests 'ua.pysanka.*' assembleRelease > deps.log 2>&1 || true
          mkdir -p meta
          cp gradle/verification-metadata.xml meta/ 2>/dev/null || echo "no metadata written" > meta/MISSING
          # Room writes the schema of a new database version during the build; keep it so it can be committed
          cp -r app/schemas meta/ 2>/dev/null || true
          { grep -E "^e: |FAILED|What went wrong|Exception" -A5 deps.log | head -3000 || true; echo ----; tail -80 deps.log; } > meta/deps.log || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: verification-metadata
          path: meta/

  publish:
    needs: generate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: verification-metadata
          path: out
      - name: Push for review
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          git init -q && git checkout -q -b deps-metadata && git add . && git -c user.name=ci -c user.email=ci@localhost commit -qm "verification metadata ${{ github.run_number }}"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}" deps-metadata
